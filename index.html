<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspeção de Manutenção – Quartos</title>

<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; padding:15px; }
h1,h2 { margin-top:0; }
.section { background:#fff; padding:12px; margin-bottom:15px; border-radius:6px; }
.item { margin-bottom:12px; }
.obs { display:none; width:100%; margin-top:6px; }
button { width:100%; padding:12px; font-size:16px; background:#0078d4; color:#fff; border:none; border-radius:6px; }
.hidden { display:none; }
</style>

<script>
/* LOGIN SIMPLES */
function login() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;
  if (u === "pedro" && p === "mnt") {
    document.getElementById("login").style.display="none";
    document.getElementById("form").style.display="block";
  } else {
    alert("Credenciais inválidas.");
  }
}

/* DATA AUTOMÁTICA */
window.onload = function() {
  const d = new Date();
  document.getElementById("data").value =
    d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* MOSTRAR OBS APENAS NOK */
function toggleObs(id, nok) {
  document.getElementById(id+"_obs").style.display = nok ? "block" : "none";
}

/* SUBMISSÃO – APENAS NOK */
function prepararEnvio() {
  let corpo = "";
  let existeNOK = false;

  document.querySelectorAll(".item").forEach(i => {
    const nok = i.querySelector(".nok");
    const obs = i.querySelector("textarea");

    if (nok.checked) {
      if (obs.value.trim()==="") {
        alert("Observação obrigatória nos NOK.");
        throw "Erro";
      }
      existeNOK = true;
      corpo += "- " + nok.dataset.desc + "\n  Obs: " + obs.value + "\n\n";
    }
  });

  if (!existeNOK) {
    alert("Inspeção sem anomalias.");
    throw "Sem NOK";
  }

  document.getElementById("mensagem").value =
    "Data: " + document.getElementById("data").value +
    "\nQuarto: " + document.getElementById("quarto").value +
    "\n\nNOK:\n" + corpo;
}
</script>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="section">
<h2>Acesso</h2>
<input id="user" placeholder="Utilizador"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">Entrar</button>
</div>

<!-- FORM -->
<div id="form" class="hidden">
<h1>Inspeção de Manutenção – Quartos</h1>

<form action="https://api.web3forms.com/submit" method="POST" onsubmit="prepararEnvio()">
<input type="hidden" name="access_key" value="SEU_ACCESS_KEY_AQUI">
<input type="hidden" name="message" id="mensagem">
<input type="hidden" id="data" name="data">

<div class="section">
<label>Quarto nº</label><br>
<input type="number" id="quarto" required style="width:100%">
</div>

<!-- EXEMPLO ITEM (modelo usado em todos) -->
<div class="section">
<h2>Portas e Acessos</h2>

<div class="item">
<label>Batentes/limitadores e dobradiças sem folgas</label><br>
<input type="radio" name="p1" onclick="toggleObs('p1',false)"> OK
<input type="radio" name="p1" class="nok" data-desc="Batentes/limitadores e dobradiças sem folgas" onclick="toggleObs('p1',true)"> NOK
<textarea id="p1_obs" class="obs" placeholder="Observações"></textarea>
</div>

<!-- REPETIR ESTE BLOCO PARA TODOS OS ITENS DA LISTA -->
</div>

<button type="submit">Submeter inspeção</button>
</form>
</div>

</body>
</html>
