<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspeção de Manutenção – Quartos</title>

<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; padding:15px; }
h1 { font-size:22px; }
.section { background:#fff; padding:15px; margin-bottom:15px; border-radius:6px; }
.item { margin-bottom:14px; }
label { font-weight:bold; display:block; }
.obs { display:none; width:100%; margin-top:6px; }
button { background:#0078d4; color:#fff; padding:14px; width:100%; border:none; border-radius:6px; font-size:16px; }
</style>

<script>
function toggleObs(id, nok) {
  const obs = document.getElementById(id+"_obs");
  obs.style.display = nok ? "block" : "none";
}

function prepararEnvio() {
  const quarto = document.getElementById("quarto");
  if (!quarto.value.trim()) {
    alert("Indique o número do quarto.");
    quarto.focus();
    return false;
  }

  const hoje = new Date().toLocaleDateString("pt-PT");
  let texto = `Data: ${hoje}\nQuarto: ${quarto.value}\n\nNOK:\n`;
  let encontrouNOK = false;

  const itens = document.querySelectorAll(".item");

  for (const item of itens) {
    const ok = item.querySelector(".ok");
    const nok = item.querySelector(".nok");
    const obs = item.querySelector("textarea");

    if (!ok.checked && !nok.checked) {
      alert("Todos os itens devem ser marcados como OK ou NOK.");
      item.scrollIntoView({behavior:"smooth", block:"center"});
      return false;
    }

    if (nok.checked) {
      if (!obs.value.trim()) {
        alert("Observação obrigatória nos itens NOK.");
        obs.style.display="block";
        obs.scrollIntoView({behavior:"smooth", block:"center"});
        setTimeout(()=>obs.focus(),300);
        return false;
      }

      encontrouNOK = true;
      texto += `- ${nok.dataset.desc}\n  Obs.: ${obs.value}\n\n`;
    }
  }

  if (!encontrouNOK) {
    alert("Inspeção sem anomalias. Nada a enviar.");
    return false;
  }

  document.getElementById("finalMessage").value = texto;
  return true; // ✅ só aqui envia
}
</script>
</head>

<body>

<h1>Inspeção de Manutenção – Quartos</h1>

<form action="https://api.web3forms.com/submit"
      method="POST"
      onsubmit="return prepararEnvio();">

<!-- WEB3FORMS -->
<input type="hidden" name="access_key" value="6ccbebc1-4c92-4054-b56e-cc65b49ed8ec">
<input type="hidden" name="subject" value="INSPECAO_DIARIA">
<input type="hidden" name="message" id="finalMessage">

<div class="section">
<label>Quarto nº</label>
<input type="number" id="quarto" style="width:100%;padding:8px;">
</div>

<div class="section">
<h2>Portas e Acessos</h2>

<div class="item">
<label>Portas abrem/fecham corretamente e sem ruídos</label>
<input type="radio" class="ok"> OK
<input type="radio" class="nok" data-desc="Portas abrem/fecham corretamente e sem ruídos" onclick="toggleObs('i1',true)"> NOK
<textarea id="i1_obs" class="obs" placeholder="Observações"></textarea>
</div>

<div class="item">
<label>Bateria da fechadura eletrónica</label>
<input type="radio" class="ok"> OK
<input type="radio" class="nok" data-desc="Bateria da fechadura eletrónica" onclick="toggleObs('i2',true)"> NOK
<textarea id="i2_obs" class="obs"></textarea>
</div>

<div class="item">
<label>Molas hidráulicas bem afinadas</label>
<input type="radio" class="ok"> OK
<input type="radio" class="nok" data-desc="Molas hidráulicas bem afinadas" onclick="toggleObs('i3',true)"> NOK
<textarea id="i3_obs" class="obs"></textarea>
</div>

</div>

<button type="submit">Submeter inspeção</button>
</form>

</body>
</html>
