<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspeção de Manutenção – Quartos</title>

<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; padding:15px; }
h1,h2 { margin-top:0; }
.section { background:#fff; padding:15px; margin-bottom:15px; border-radius:6px; }
.item { margin-bottom:14px; }
label { font-weight:bold; display:block; }
.obs { display:none; width:100%; margin-top:6px; }
button { background:#0078d4; color:#fff; padding:14px; width:100%; border:none; border-radius:6px; font-size:16px; }
.hidden { display:none; }
</style>

<script>
/* LOGIN */
function login() {
  if (user.value === "pedro" && pass.value === "mnt") {
    loginBox.style.display = "none";
    formBox.style.display = "block";
  } else {
    alert("Credenciais inválidas.");
  }
}

/* OBS NOK */
function toggleObs(id, nok) {
  document.getElementById(id+"_obs").style.display = nok ? "block" : "none";
}

/* SUBMISSÃO */
function prepararEnvio() {
  const quarto = document.getElementById("quarto");
  if (!quarto.value.trim()) {
    alert("Indique o número do quarto.");
    quarto.focus();
    return false;
  }

  const data = new Date().toLocaleDateString("pt-PT");
  let texto = `Data: ${data}\nQuarto: ${quarto.value}\n\nNOK:\n`;
  let temNOK = false;

  for (const item of document.querySelectorAll(".item")) {
    const ok = item.querySelector(".ok");
    const nok = item.querySelector(".nok");
    const obs = item.querySelector("textarea");

    if (!ok.checked && !nok.checked) {
      alert("Todos os itens devem ser marcados como OK ou NOK.");
      item.scrollIntoView({behavior:"smooth", block:"center"});
      return false;
    }

    if (nok.checked) {
      if (!obs.value.trim()) {
        alert("Observação obrigatória nos itens NOK.");
        obs.style.display = "block";
        obs.scrollIntoView({behavior:"smooth", block:"center"});
        setTimeout(()=>obs.focus(),300);
        return false;
      }
      temNOK = true;
      texto += `- ${nok.dataset.desc}\n  Obs.: ${obs.value}\n\n`;
    }
  }

  if (!temNOK) {
    alert("Inspeção sem anomalias. Nada a enviar.");
    return false;
  }

  finalMessage.value = texto;
  return true;
}
</script>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="section">
<h2>Acesso</h2>
<input id="user" placeholder="Utilizador"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">Entrar</button>
</div>

<!-- FORM -->
<div id="formBox" class="hidden">
<h1>Inspeção de Manutenção – Quartos</h1>

<form action="https://api.web3forms.com/submit" method="POST" onsubmit="return prepararEnvio();">

<input type="hidden" name="access_key" value="6ccbebc1-4c92-4054-b56e-cc65b49ed8ec">
<input type="hidden" name="subject" value="INSPECAO_DIARIA">
<input type="hidden" name="message" id="finalMessage">

<div class="section">
<label>Quarto nº</label>
<input type="number" id="quarto" style="width:100%;padding:8px;">
</div>

<script>
const checklist = {
"Portas e Acessos":[
"Portas abrem/fecham corretamente e sem ruídos",
"Bateria da fechadura eletrónica",
"Leitor de cartões funcional",
"Molas hidráulicas bem afinadas",
"Fecho/tranca porta principal funcional",
"Batentes/limitadores e dobradiças sem folgas"
],
"Eletricidade":[
"Iluminação geral","Candeeiros","Interruptores","Tomadas","Tomadas USB",
"Estado dos cabos e arrumados (com abraçadeira)",
"Quadros / tampas elétricas bem fixas",
"Sensores de movimento dos roupeiros"
],
"Climatização":[
"Ar condicionado funcional e sem ruídos",
"Grelhas de ar desobstruídas",
"Extração do WC funcional"
],
"WC":[
"Sanita desentupida","Autoclismo funcional",
"Duche com pressão adequada","Estado do duche de mão",
"Misturadoras funcionais","Ralos com escoamento normal",
"Tampa sanita","Iluminação espelho","Massa de juntas"
],
"Equipamentos":[
"TV + Coluna WC","Comando TV","Telefone",
"Cofre","Mini-bar","Wi-Fi"
],
"Estrutura / Acabamentos":[
"Indícios de humidade","Suportes de amenities",
"Suportes gerais","Pintura geral",
"Papel de parede","Cabeceira de cama",
"Cadeiras","Abat-jours","Janelas",
"Silicones","Mobiliário","Autocolantes WC"
],
"Segurança":[
"Detetor de fumo funcional",
"Planta de emergência bem afixada"
]
};

let id=1;
for (const sec in checklist) {
  document.write(`<div class="section"><h2>${sec}</h2>`);
  checklist[sec].forEach(t=>{
    document.write(`
    <div class="item">
      <label>${t}</label>
      <input type="radio" class="ok"> OK
      <input type="radio" class="nok" data-desc="${t}" onclick="toggleObs('i${id}',true)"> NOK
      <textarea id="i${id}_obs" class="obs" placeholder="Observações"></textarea>
    </div>`);
    id++;
  });
  document.write("</div>");
}
</script>

<button type="submit">Submeter inspeção</button>
</form>
</div>

</body>
</html>
